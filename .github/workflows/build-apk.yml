      - name: Install dependencies
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: Allow vibration
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: تارجت اليوم (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
